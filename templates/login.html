{% extends 'base.html' %}

{% block title %}Log In | SkillSwap{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: clamp(1.5rem, 4vw, 3rem) auto;">
  <div class="card" style="padding: clamp(1.25rem, 4vw, 2.25rem); border-color: var(--champagne-gold-border); box-shadow: var(--shadow-md);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1.25rem; width: 48px; height: 48px; font-size: 1.25rem;">
        <i class="fas fa-right-to-bracket" style="color: var(--champagne-gold);"></i>
      </div>
      <h1 style="font-size: 1.85rem; font-weight: 800; letter-spacing: -0.025em; color: var(--heading-color);">Welcome Back</h1>
      <p style="color: var(--body-text); font-size: 0.94rem; margin-top: 0.35rem;">
        Sign in to manage your skill swaps, active chats &amp; peer network
      </p>
    </div>

    <!-- Quick Demo Accounts for Testing / Evaluators -->
    <div class="demo-box">
      <div class="demo-box-label">
        <i class="fas fa-bolt"></i> 1-Click Demo Logins:
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 0.45rem;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemoLogin('ashika@skillswap.com', 'password123')">
          Ashika Shetty
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemoLogin('ganavi@skillswap.com', 'password123')">
          Ganavi K.H
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemoLogin('rahul@skillswap.com', 'password123')">
          Rahul
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemoLogin('admin@skillswap.com', 'admin123')">
          Admin Portal
        </button>
      </div>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input type="email" class="form-control" id="login-email" name="email" placeholder="name@college.edu" required autocomplete="email">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
          <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
        </div>
        <input type="password" class="form-control" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-lg" id="login-submit-btn" style="width: 100%; margin-top: 1.25rem;">
        <i class="fas fa-right-to-bracket"></i> Sign In to SkillSwap
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.92rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--champagne-gold); font-weight: 700;">Join free now</a>
    </div>
  </div>
</div>
{% endblock %}
